name: LifeSync AI - Desktop Packaging & Release (Windows)

on:
  push:
    branches:
      - main
      - 'minhhungnt123/**'
    paths:
      - 'frontend/src-tauri/**'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Installer (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Build Tauri Desktop Installers (NSIS .exe & WiX .msi)
        working-directory: ./frontend
        run: npm run tauri build

      - name: Upload Windows Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeSync-AI-Windows-Installers
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

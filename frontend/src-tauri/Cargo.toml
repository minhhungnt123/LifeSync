[package]
name = "lifesync-desktop"
version = "1.0.0"
description = "LifeSync AI - Productivity & Wellness Companion"
authors = ["LifeSync Team"]
license = "MIT"
repository = "https://github.com/minhhungnt123/LifeSync"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lifesync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"

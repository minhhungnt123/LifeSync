services:
  postgres:
    image: postgres:16-alpine
    container_name: lifesync-postgres
    restart: always
    environment:
      POSTGRES_DB: lifesync_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifesync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
